<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المكتبة الإلكترونية</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=Lato:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #F8F7F4;
      --surface: #FFFFFF;
      --border: #E4E0D8;
      --ink: #1C1C1E;
      --muted: #6B6860;
      --accent: #2D6A4F;
      --accent-light: #D8EEE5;
      --accent-hover: #245A42;
      --tag-bg: #EEF4F1;
      --tag-text: #2D6A4F;
      --shadow: 0 2px 12px rgba(0,0,0,0.07);
      --radius: 12px;
      --font-ar: 'Tajawal', sans-serif;
      --font-en: 'Lato', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-ar);
      font-size: 16px;
      line-height: 1.7;
      min-height: 100vh;
    }

    body.en {
      font-family: var(--font-en);
      direction: ltr;
    }

    /* ── HEADER ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--ink);
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: var(--accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 18px;
    }

    .logo-text {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .lang-btn {
      background: var(--tag-bg);
      color: var(--tag-text);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 5px 14px;
      font-size: 13px;
      font-family: var(--font-en);
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
      letter-spacing: 0.5px;
    }

    .lang-btn:hover { background: var(--accent-light); }

    /* ── HERO ── */
    .hero {
      padding: 56px 32px 40px;
      max-width: 900px;
      margin: 0 auto;
      text-align: center;
    }

    .hero h1 {
      font-size: clamp(26px, 5vw, 42px);
      font-weight: 700;
      line-height: 1.3;
      color: var(--ink);
      margin-bottom: 12px;
    }

    .hero h1 span {
      color: var(--accent);
    }

    .hero p {
      color: var(--muted);
      font-size: 16px;
      max-width: 480px;
      margin: 0 auto 28px;
    }

    /* ── SEARCH ── */
    .search-wrap {
      max-width: 520px;
      margin: 0 auto;
      position: relative;
    }

    .search-wrap input {
      width: 100%;
      padding: 14px 20px 14px 48px;
      border: 1.5px solid var(--border);
      border-radius: 40px;
      font-family: var(--font-ar);
      font-size: 15px;
      background: var(--surface);
      color: var(--ink);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    body.en .search-wrap input {
      font-family: var(--font-en);
      padding: 14px 48px 14px 20px;
    }

    .search-wrap input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-light);
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 17px;
      pointer-events: none;
    }

    body.en .search-icon { left: auto; right: 16px; }

    /* ── مناهل الزاد SECTION ── */
    .manahil-section {
      max-width: 900px;
      margin: 36px auto 0;
      padding: 0 32px;
    }
    .manahil-section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .manahil-section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--ink);
    }
    .manahil-section-icon { font-size: 1.4rem; }
    .manahil-file-count {
      background: #1B4FBC;
      color: #fff;
      font-size: .75rem;
      font-weight: 700;
      padding: 2px 10px;
      border-radius: 20px;
    }
    .manahil-btn-upload {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 18px;
      border-radius: 30px;
      background: #C8A951;
      color: #fff;
      font-family: var(--font-ar);
      font-size: .88rem;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
      transition: opacity .15s, transform .15s;
    }
    .manahil-btn-upload:hover { opacity: .88; transform: scale(1.03); }

    /* Grade tabs */
    .manahil-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .manahil-tab {
      padding: 7px 18px;
      border-radius: 30px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-family: var(--font-ar);
      font-size: .88rem;
      font-weight: 700;
      cursor: pointer;
      transition: all .18s;
    }
    .manahil-tab:hover { border-color: #1B4FBC; color: #1B4FBC; }
    .manahil-tab.active { background: #1B4FBC; border-color: #1B4FBC; color: #fff; }

    /* Files grid — same style as book grid */
    .manahil-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
      margin-bottom: 12px;
    }
    .manahil-card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
      border: 1.5px solid transparent;
      text-decoration: none;
      color: var(--ink);
      display: flex;
      flex-direction: column;
    }
    .manahil-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,.12); border-color: #1B4FBC; }
    .manahil-card-cover {
      height: 110px;
      background: linear-gradient(135deg, #e8effe, #d4e0fc);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.4rem;
      position: relative;
    }
    .manahil-card-grade-tag {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(27,79,188,.85);
      color: #fff;
      font-size: .65rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 8px;
    }
    .manahil-card-body { padding: 10px 12px 12px; flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .manahil-card-title { font-size: .88rem; font-weight: 700; line-height: 1.4; }
    .manahil-card-sub { font-size: .75rem; color: var(--muted); }
    .manahil-card-dl {
      margin-top: auto;
      padding-top: 8px;
      font-size: .8rem;
      font-weight: 700;
      color: #1B4FBC;
    }

    /* Loading / empty */
    .manahil-loading {
      grid-column: 1/-1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 32px;
      color: var(--muted);
      font-size: .9rem;
    }
    .manahil-spinner {
      width: 22px; height: 22px;
      border: 3px solid var(--border);
      border-top-color: #1B4FBC;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .manahil-empty {
      grid-column: 1/-1;
      text-align: center;
      padding: 28px;
      color: var(--muted);
      font-size: .9rem;
    }

    /* Divider between manahil and books */
    .section-divider {
      max-width: 900px;
      margin: 32px auto 0;
      padding: 0 32px;
      border: none;
      border-top: 2px solid var(--border);
    }

    @media (max-width: 600px) {
      .manahil-section { padding: 0 16px; }
      .manahil-grid { grid-template-columns: repeat(2, 1fr); }
    }

    /* ── FILTERS ── */
    .filters {
      max-width: 900px;
      margin: 32px auto 0;
      padding: 0 32px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .filter-btn {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 20px;
      padding: 7px 18px;
      font-family: var(--font-ar);
      font-size: 14px;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    body.en .filter-btn { font-family: var(--font-en); }

    .filter-btn:hover, .filter-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    /* ── SECTION LABEL ── */
    .section-label {
      max-width: 900px;
      margin: 40px auto 16px;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .section-label h2 {
      font-size: 17px;
      font-weight: 700;
      color: var(--ink);
    }

    .count-badge {
      background: var(--tag-bg);
      color: var(--tag-text);
      font-size: 13px;
      padding: 3px 10px;
      border-radius: 12px;
      font-weight: 500;
    }

    /* ── GRID ── */
    .grid {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 32px 60px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
    }

    /* ── BOOK CARD ── */
    .book-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
    }

    .book-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow);
    }

    .book-cover {
      width: 100%;
      aspect-ratio: 3/4;
      object-fit: cover;
      display: block;
      background: var(--accent-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      color: var(--accent);
      flex-shrink: 0;
    }

    .book-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .book-info {
      padding: 12px 12px 14px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .book-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.4;
    }

    .book-author {
      font-size: 12px;
      color: var(--muted);
    }

    .book-tag {
      display: inline-block;
      margin-top: 6px;
      background: var(--tag-bg);
      color: var(--tag-text);
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      width: fit-content;
    }

    /* ── EMPTY STATE ── */
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      grid-column: 1/-1;
    }

    .empty .empty-icon { font-size: 48px; margin-bottom: 12px; }
    .empty p { font-size: 15px; }

    /* ── MODAL OVERLAY ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 200;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--surface);
      border-radius: 20px 20px 0 0;
      width: 100%;
      max-width: 700px;
      max-height: 95vh;
      display: flex;
      flex-direction: column;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(40px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal-header {
      padding: 20px 24px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }

    .modal-cover {
      width: 70px;
      height: 95px;
      border-radius: 8px;
      background: var(--accent-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      color: var(--accent);
      flex-shrink: 0;
      overflow: hidden;
    }

    .modal-cover img { width: 100%; height: 100%; object-fit: cover; }

    .modal-meta { flex: 1; }
    .modal-meta h2 { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
    .modal-meta p { font-size: 14px; color: var(--muted); margin-bottom: 8px; }

    .modal-close {
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      color: var(--muted);
      line-height: 1;
      padding: 4px;
    }

    .modal-body {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .pdf-viewer {
      flex: 1;
      border: none;
      width: 100%;
      height: 100%;
      min-height: 55vh;
    }

    .modal-footer {
      padding: 14px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: center;
    }

    .read-btn {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 24px;
      padding: 11px 28px;
      font-family: var(--font-ar);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
      text-decoration: none;
      display: inline-block;
    }

    body.en .read-btn { font-family: var(--font-en); }
    .read-btn:hover { background: var(--accent-hover); }

    /* ── FOOTER ── */
    footer {
      text-align: center;
      padding: 24px;
      color: var(--muted);
      font-size: 13px;
      border-top: 1px solid var(--border);
    }

    /* ── UPLOAD PANEL (admin) ── */
    .add-book-btn {
      background: var(--surface);
      border: 1.5px dashed var(--border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      min-height: 220px;
      gap: 8px;
      color: var(--muted);
      font-size: 14px;
      transition: border-color 0.2s, color 0.2s;
    }

    .add-book-btn:hover { border-color: var(--accent); color: var(--accent); }
    .add-book-btn .plus { font-size: 28px; }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      header { padding: 0 16px; }
      .hero { padding: 36px 16px 28px; }
      .filters, .section-label { padding: 0 16px; }
      .grid { padding: 0 16px 48px; grid-template-columns: repeat(2, 1fr); gap: 14px; }
      .modal { border-radius: 16px 16px 0 0; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <a class="logo" href="#">
      <div class="logo-icon">📚</div>
      <span class="logo-text" data-ar="المكتبة الإلكترونية" data-en="Digital Library">المكتبة الإلكترونية</span>
    </a>
    <div class="header-actions">
      <button class="lang-btn" id="langToggle" onclick="toggleLang()">EN</button>
    </div>
  </header>

  <!-- HERO -->
  <section class="hero">
    <h1 data-ar="اكتشف عالم <span style='color:var(--accent)'>القراءة</span>" data-en="Discover the world of <span style='color:var(--accent)'>Reading</span>">
      اكتشف عالم <span>القراءة</span>
    </h1>
    <p data-ar="مكتبتك المدرسية الإلكترونية — كتب عربية وإنجليزية لطلاب المرحلة المتوسطة"
       data-en="Your school's digital library — Arabic and English books for middle school students">
      مكتبتك المدرسية الإلكترونية — كتب عربية وإنجليزية لطلاب المرحلة المتوسطة
    </p>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput"
        placeholder="ابحث عن كتاب أو كاتب..."
        data-ar-placeholder="ابحث عن كتاب أو كاتب..."
        data-en-placeholder="Search for a book or author..."
        oninput="renderBooks()" />
    </div>
  </section>

  <!-- FILTERS -->
  <div class="filters" id="filters">
    <button class="filter-btn active" data-cat="all" data-ar="الكل" data-en="All" onclick="filterBy(this)">الكل</button>
    <button class="filter-btn" data-cat="arabic" data-ar="عربي" data-en="Arabic" onclick="filterBy(this)">عربي</button>
    <button class="filter-btn" data-cat="english" data-ar="إنجليزي" data-en="English" onclick="filterBy(this)">إنجليزي</button>
    <button class="filter-btn" data-cat="science" data-ar="علوم" data-en="Science" onclick="filterBy(this)">علوم</button>
    <button class="filter-btn" data-cat="history" data-ar="تاريخ" data-en="History" onclick="filterBy(this)">تاريخ</button>
    <button class="filter-btn" data-cat="stories" data-ar="قصص" data-en="Stories" onclick="filterBy(this)">قصص</button>
    <button class="filter-btn" data-cat="booklet" data-ar="كتيبات" data-en="Booklets" onclick="filterBy(this)">كتيبات</button>
  </div>

  <!-- SECTION LABEL -->
  <div class="section-label">
    <h2 id="sectionTitle" data-ar="جميع الكتب" data-en="All Books">جميع الكتب</h2>
    <span class="count-badge" id="countBadge">0 كتاب</span>
  </div>

  <!-- GRID -->
  <div class="grid" id="bookGrid"></div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-cover" id="modalCover">📖</div>
        <div class="modal-meta">
          <h2 id="modalTitle"></h2>
          <p id="modalAuthor"></p>
          <span class="book-tag" id="modalTag"></span>
        </div>
        <button class="modal-close" onclick="closeModalDirect()">✕</button>
      </div>
      <div class="modal-body">
        <iframe class="pdf-viewer" id="pdfViewer" src=""></iframe>
      </div>
      <div class="modal-footer">
        <a class="read-btn" id="downloadBtn" href="#" download
           data-ar="تحميل الكتاب" data-en="Download Book">تحميل الكتاب</a>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <footer>
    <span data-ar="© المكتبة الإلكترونية المدرسية — جميع الحقوق محفوظة"
          data-en="© School Digital Library — All rights reserved">
      © المكتبة الإلكترونية المدرسية — جميع الحقوق محفوظة
    </span>
  </footer>

  <script>
    // ────────────────────────────────────────────

        title_en: "History of Islamic Civilization",
        author_ar: "أحمد بن محمد",
        author_en: "Ahmed bin Mohammed",
        category: "history",

      },
      {
        id: 5,

        title_en: "Grade 7 Mathematics Booklet",
        author_ar: "إدارة المناهج",
        author_en: "Curriculum Department",
        category: "booklet",

      {

      },
    ];

    // ────────────────────────────────────────────
    // STATE
    // ────────────────────────────────────────────
    let currentLang = 'ar';
    let currentFilter = 'all';

    const tagLabels = {
      stories:  { ar: "قصص",      en: "Stories" },
      science:  { ar: "علوم",      en: "Science" },
      history:  { ar: "تاريخ",     en: "History" },
      booklet:  { ar: "كتيب",      en: "Booklet" },
      arabic:   { ar: "عربي",      en: "Arabic"  },
      english:  { ar: "إنجليزي",   en: "English" },
    };

    // ────────────────────────────────────────────
    // LANGUAGE TOGGLE
    // ────────────────────────────────────────────
    function toggleLang() {
      currentLang = currentLang === 'ar' ? 'en' : 'ar';
      const isEn = currentLang === 'en';
      document.documentElement.lang = currentLang;
      document.documentElement.dir = isEn ? 'ltr' : 'rtl';
      document.body.classList.toggle('en', isEn);
      document.getElementById('langToggle').textContent = isEn ? 'ع' : 'EN';

      // Update all translatable elements
      document.querySelectorAll('[data-ar]').forEach(el => {
        const val = el.getAttribute(isEn ? 'data-en' : 'data-ar');
        if (val !== null) el.innerHTML = val;
      });

      // Search placeholder
      const inp = document.getElementById('searchInput');
      inp.placeholder = inp.getAttribute(isEn ? 'data-en-placeholder' : 'data-ar-placeholder');

      renderBooks();
    }

    // ────────────────────────────────────────────
    // FILTER
    // ────────────────────────────────────────────
    function filterBy(btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.cat;
      renderBooks();
    }

    // ────────────────────────────────────────────
    // RENDER
    // ────────────────────────────────────────────
    function renderBooks() {
      const isEn = currentLang === 'en';
      const query = document.getElementById('searchInput').value.toLowerCase();
      const grid = document.getElementById('bookGrid');

      let filtered = books.filter(b => {
        const matchCat = currentFilter === 'all' || b.category === currentFilter || b.lang === currentFilter;
        const title = isEn ? b.title_en : b.title_ar;
        const author = isEn ? b.author_en : b.author_ar;
        const matchSearch = !query || title.toLowerCase().includes(query) || author.toLowerCase().includes(query);
        return matchCat && matchSearch;
      });

      // Count badge
      const badge = document.getElementById('countBadge');
      badge.textContent = isEn
        ? `${filtered.length} book${filtered.length !== 1 ? 's' : ''}`
        : `${filtered.length} كتاب`;

      // Empty state
      if (filtered.length === 0) {
        grid.innerHTML = `<div class="empty">
          <div class="empty-icon">📭</div>
          <p>${isEn ? 'No books found. Try a different search.' : 'لا توجد كتب. جرّب بحثاً مختلفاً.'}</p>
        </div>`;
        return;
      }

      grid.innerHTML = filtered.map(b => {
        const title = isEn ? b.title_en : b.title_ar;
        const author = isEn ? b.author_en : b.author_ar;
        const tag = tagLabels[b.category]?.[currentLang] || '';
        return `
          <div class="book-card" onclick="openBook(${b.id})">
            <div class="book-cover">${b.emoji}</div>
            <div class="book-info">
              <div class="book-title">${title}</div>
              <div class="book-author">${author}</div>
              <span class="book-tag">${tag}</span>
            </div>
          </div>`;
      }).join('');
    }

    // ────────────────────────────────────────────
    // MODAL
    // ────────────────────────────────────────────
    function openBook(id) {
      const b = books.find(x => x.id === id);
      if (!b) return;
      // مناهل الزاد files open directly (Supabase Storage URL)
      if (b._manahil) { window.open(b.file, '_blank'); return; }
      const isEn = currentLang === 'en';

      document.getElementById('modalTitle').textContent = isEn ? b.title_en : b.title_ar;
      document.getElementById('modalAuthor').textContent = isEn ? b.author_en : b.author_ar;
      document.getElementById('modalTag').textContent = tagLabels[b.category]?.[currentLang] || '';
      document.getElementById('modalCover').innerHTML = b.emoji;
      document.getElementById('pdfViewer').src = b.file;
      document.getElementById('downloadBtn').href = b.file;
      document.getElementById('downloadBtn').textContent = isEn ? 'Download Book' : 'تحميل الكتاب';
      document.getElementById('modalOverlay').classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeModal(e) {
      if (e.target === document.getElementById('modalOverlay')) closeModalDirect();
    }

    function closeModalDirect() {
      document.getElementById('modalOverlay').classList.remove('open');
      document.getElementById('pdfViewer').src = '';
      document.body.style.overflow = '';
    }

    // Keyboard close
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModalDirect(); });

    // ────────────────────────────────────────────
    // INIT
    // ────────────────────────────────────────────
    renderBooks();
  </script>

    const SUBJECT_ICONS = {
      arabic:'🌙', english:'🔤', french:'🇫🇷', math:'📐',
      science:'🔬', social:'🌍', islamic:'☪️', citizenship:'🏫',
    };
    const GRADE_LABELS = {
      grade1: 'الصف الأول الإعدادي',
      grade2: 'الصف الثاني الإعدادي',
      grade3: 'الصف الثالث الإعدادي',
    };
    const SUBJECT_LABELS = {
      arabic:'اللغة العربية', english:'اللغة الإنجليزية', french:'اللغة الفرنسية',
      math:'الرياضيات', science:'العلوم', social:'الدراسات الاجتماعية',
      islamic:'التربية الإسلامية', citizenship:'التربية الوطنية',
    };

    async function loadManahil() {
      try {
        const { data, error } = await sb.from('manahil_files').select('*').order('uploaded_at', { ascending: false });
        if (error || !data || data.length === 0) return;

        // Convert each manahil file into the same shape as a book object
        const manahilBooks = data.map((f, i) => ({
          id: 'm_' + f.id,
          title_ar: f.title,
          title_en: f.title,
          author_ar: f.author || (GRADE_LABELS[f.grade] || f.grade),
          author_en: f.author || (GRADE_LABELS[f.grade] || f.grade),
          category: 'manahil',
          lang: 'arabic',
          emoji: SUBJECT_ICONS[f.subject] || '📄',
          file: f.file_url,
          _manahil: true,
          _grade: GRADE_LABELS[f.grade] || f.grade,
          _subject: SUBJECT_LABELS[f.subject] || f.subject,
        }));

        // Add manahil tag label
        if (!tagLabels.manahil) {
          tagLabels.manahil = { ar: 'مناهل الزاد', en: 'Curriculum' };
        }

        // Merge into books array and re-render
        books.push(...manahilBooks);
        renderBooks();
      } catch(e) {
        console.warn('manahil load failed', e);
      }
    }

    loadManahil();
  })();
  </script>
